<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cyber Reader Core</title>
    <style>
        :root { --glow: #00ff41; --bg: #0d0d0d; }
        body { 
            width: 100%; height: 100vh; margin: 0; padding: 15px; box-sizing: border-box;
            background: var(--bg); color: var(--glow); font-family: monospace;
            display: flex; flex-direction: column;
        }
        .header { border-bottom: 2px solid var(--glow); padding-bottom: 8px; margin-bottom: 15px; font-weight: bold; }
        .status-box { border: 1px solid #333; padding: 10px; font-size: 0.8rem; margin-bottom: 15px; }
        #engine-status { color: #ff3e3e; font-weight: bold; }
        #engine-status.active { color: var(--glow); text-shadow: 0 0 8px var(--glow); }
        button {
            background: transparent; border: 1px solid var(--glow); color: var(--glow);
            padding: 12px; cursor: pointer; font-weight: bold; text-transform: uppercase;
        }
        button:hover { background: var(--glow); color: #000; box-shadow: 0 0 15px var(--glow); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .log-container {
            margin-top: 15px; flex-grow: 1; background: #050505; border: 1px solid #222;
            padding: 10px; font-size: 0.7rem; overflow-y: auto; color: #008f11;
        }
    </style>
</head>
<body>
    <div class="header">CYBER-READER v1.0.3</div>
    <div class="status-box">
        KERNEL: <span id="engine-status">OFFLINE</span><br>
        MEMORY: <span id="mem-usage">1.54 MB</span>
    </div>
    <button id="process-btn">BOOT KERNEL</button>
    <div class="log-container" id="console-log">
        <div>> System ready...</div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
